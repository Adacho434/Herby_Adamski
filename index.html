<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miasta i herby</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #000000;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        td {
            border: 1px solid #7f7f7f;
            padding: 10px;
            vertical-align: middle;
        }

        .city-name {
            width: 25%;
            font-size: 11px;
            color: #333333;
            padding-left: 12px;
        }
        .city-crest {
            width: 75%;
            text-align: center;
            background-color: #ffffff;
        }

        .city-crest img {
            height: 160px;
            width: auto;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h1>Miasta i herby</h1>

    <table border="1">
        <tr>
            <td class="city-name">Kraków</td>
            <td class="city-crest">
                <img src="krakow.png" alt="Herb Krakowa">
            </td>
        </tr>
        <tr>
            <td class="city-name">Sevilla</td>
            <td class="city-crest">
                <img src="sevilla.jpg" alt="Herb Sevilli">
            </td>
        </tr>
        <tr>
            <td class="city-name">Mysłowice</td>
            <td class="city-crest">
                <img src="myslowice.jpg" alt="Herb Mysłowic">
            </td>
        </tr>
       <tr>
            <td class="city-name">Katowice</td>
            <td class="city-crest">
                <img src="kato.png" alt="Herb Katowic">
            </td>
        </tr>
    </table>

</body>
</html>
